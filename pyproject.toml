[tool.ruff]
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "INP001",
  "S404",
  "T201",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["D1", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "all"
enableTypeIgnoreComments = false
failOnWarnings = true
include = ["modules", "lib", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["modules", "scripts/style/tests"]
addopts = [
  "-p", "no:cacheprovider",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
filterwarnings = ["error"]
xfail_strict = true
timeout = 60

[tool.coverage.run]
branch = true
patch = ["subprocess"]
sigterm = true
source_dirs = ["modules", "scripts/style"]

[tool.coverage.report]
fail_under = 100
include_namespace_packages = true
show_missing = true
skip_covered = true
exclude_also = [
  'if __name__ == "__main__":',
  "assert_never\\(",
]
