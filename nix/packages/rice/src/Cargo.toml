[package]
name = "rice"
version = "0.1.0"
edition = "2024"
description = "NixOS/Darwin configuration management CLI"
license-file = "../../../../COPYING"
repository = "https://github.com/anntnzrb/_nixrice"
readme = "../../../../README.md"
keywords = ["nix", "cli", "rust", "dotfiles"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rice"
path = "main.rs"

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
clap = { version = "4.5.32", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
hostname = { version = "0.4.0", default-features = false }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
"missing-docs-in-private-items" = "deny"
