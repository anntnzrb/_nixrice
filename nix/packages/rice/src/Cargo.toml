[package]
name = "rice"
version = "0.1.0"
edition = "2024"
description = "NixOS/Darwin configuration management CLI"
license-file = "../../../../COPYING"
repository = "https://github.com/anntnzrb/_nixrice"
readme = "../../../../README.md"
keywords = ["nix", "cli", "rust", "dotfiles"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rice"
path = "main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.32", features = ["derive"] }
hostname = "0.4.0"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
