[package]
name = "rice"
version = "0.1.0"
edition = "2024"
description = "NixOS/Darwin configuration management CLI"
license-file = "../../../../COPYING"
repository = "https://github.com/anntnzrb/_nixrice"
readme = "../../../../README.md"
keywords = ["nix", "cli", "rust", "dotfiles"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rice"
path = "main.rs"

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
clap = { version = "4.5.32", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
hostname = { version = "0.4.0", default-features = false }

[lints.rust]
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
private_interfaces = "deny"
private_bounds = "deny"
unused_crate_dependencies = "deny"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
private_doc_tests = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
"missing-docs-in-private-items" = "deny"
