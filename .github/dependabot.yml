version: 2
registries:
  clan:
    type: git
    url: https://git.clan.lol

updates:
  - package-ecosystem: nix
    directory: /
    registries:
      - clan
    schedule:
      interval: weekly
    groups:
      flake-inputs:
        patterns: ["*"]
    commit-message:
      prefix: chore(flake)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
