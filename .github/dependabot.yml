# Weekly updates: one PR per flake input (so a broken input never blocks the
# rest) and one grouped PR for GitHub Actions. auto-merge.yml merges each once
# the required CI checks pass.
version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    commit-message:
      prefix: chore(flake)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
