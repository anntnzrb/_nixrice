name: Nix build

# Builds every machine and home that is not in the binary cache yet, each on
# its own runner of the right platform, and pushes the results, so deploys
# substitute instead of building. An unchanged fleet builds nothing.
# Dependabot flake PRs are built before they merge (a rebase merge keeps the
# same flake.lock, so the merged commit is already cached) and `builds` is a
# required check, so an update only lands if every machine builds. Pushing
# needs CACHIX_AUTH_TOKEN as an Actions secret and, for Dependabot PRs, as a
# Dependabot secret.
on:
  workflow_dispatch:
  # every PR reports `builds`; only Dependabot flake updates build anything
  pull_request:
  push:
    branches: ["dev"]
    # only what changes what gets built
    paths:
      - flake.nix
      - flake.lock
      - clan.nix
      - identity.nix
      - "lib/**"
      - "modules/**"
      - "machines/**"
      - "homes/**"
      - "overlays/**"
  schedule:
    # weekly safety net; a no-op when everything is cached
    - cron: "30 8 * * 1"

permissions:
  contents: read

# on dev, queue behind a running build (a nearly finished one still fills the
# cache); on a PR, a newer push supersedes the running build
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # which machines and homes are missing from the cache, and on which runner
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - id: plan
        env:
          # PRs build only for flake-input updates (an Actions bump changes
          # no derivation)
          BUILD: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'dependabot/nix/') }}
        run: |
          if test "$BUILD" = true; then
            targets="$(scripts/ci/build-plan.sh)"
          else
            targets='[]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "To build: $targets" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.name }}
        env:
          ATTR: ${{ matrix.attr }}
        run: scripts/ci/build.sh "$ATTR"

  # the required check: the plan ran and every scheduled build passed
  builds:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All builds passed
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: test "$PLAN" = success && { test "$BUILD" = success || test "$BUILD" = skipped; }
