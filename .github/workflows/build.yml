name: Nix build

# Builds every machine and home on its platform and pushes the results to the
# binary cache, so deploys substitute instead of building. Pushing needs the
# CACHIX_AUTH_TOKEN secret; without it the cache is only read.
on:
  workflow_dispatch:
  push:
    branches: ["dev"]
  schedule:
    # after the weekly lock update, whose automation merges trigger nothing
    - cron: "30 8 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build machines and homes
        run: scripts/ci/build.sh
