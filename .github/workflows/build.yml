name: Nix build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev"]
    paths:
      - flake.nix
      - flake.lock
      - clan.nix
      - identity.nix
      - "lib/**"
      - "modules/**"
      - "machines/**"
      - "homes/**"
      - "overlays/**"
  schedule:
    - cron: "30 8 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - id: plan
        env:
          BUILD: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'dependabot/nix/') }}
        run: |
          if test "$BUILD" = true; then
            targets="$(scripts/ci/build-plan.sh)"
          else
            targets='[]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "To build: $targets" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # push at end; daemon drain timeout fails completed builds
          useDaemon: false

      - name: Build ${{ matrix.name }}
        env:
          ATTR: ${{ matrix.attr }}
        run: scripts/ci/build.sh "$ATTR"

  builds:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All builds passed
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: test "$PLAN" = success && { test "$BUILD" = success || test "$BUILD" = skipped; }
