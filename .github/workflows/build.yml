name: Nix build

# Builds every machine and home on its platform and pushes the results to the
# binary cache, so deploys substitute instead of building. Dependabot PRs are
# built before they merge (a rebase merge keeps the same flake.lock, so the
# merged commit is already cached) and the build is a required check, so an
# update only lands if every machine builds. Pushing needs CACHIX_AUTH_TOKEN as
# an Actions secret and, for Dependabot PRs, as a Dependabot secret.
on:
  workflow_dispatch:
  # every PR reports the check; only Dependabot flake updates build (see BUILD)
  pull_request:
  push:
    branches: ["dev"]
    # only what changes what gets built
    paths:
      - flake.nix
      - flake.lock
      - clan.nix
      - identity.nix
      - "lib/**"
      - "modules/**"
      - "machines/**"
      - "homes/**"
      - "overlays/**"
      - scripts/ci/build.sh
  schedule:
    # weekly safety net
    - cron: "30 8 * * 1"

permissions:
  contents: read

# on dev, queue behind a running build (a nearly finished one still fills the
# cache); on a PR, a newer push supersedes the running build
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # PRs build only for flake-input updates (an Actions bump changes no
      # derivation). The steps are skipped, not the job: a skipped matrix job
      # reports as plain "build" and the required checks would never arrive.
      BUILD: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'dependabot/nix/') }}
    steps:
      - name: Free disk space
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: env.BUILD == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: env.BUILD == 'true'
        uses: DeterminateSystems/nix-installer-action@v22

      - if: env.BUILD == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build machines and homes
        if: env.BUILD == 'true'
        run: scripts/ci/build.sh
