name: Nix CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - COPYING

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Test probe sharding
        run: dash tests/ci/probes.sh

      - name: Check flake
        run: scripts/ci/check-flake.sh

  probe-shards:
    name: probes ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - nixos-probe
          - darwin-probe
          - home-probe
          - home-darwin-probe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Check probes
        env:
          PROBE_TARGET: ${{ matrix.target }}
        run: scripts/ci/check-probes.sh . "$PROBE_TARGET"

  probes:
    needs: probe-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All probe shards passed
        env:
          PROBE_SHARDS: ${{ needs.probe-shards.result }}
        run: test "$PROBE_SHARDS" = success

  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Report behaviour changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          report="$(scripts/ci/report.sh "origin/${BASE_REF}")"
          {
            echo '## What this changes on each machine'
            echo
            if test -n "$report"; then
              echo "$report"
            else
              echo 'No machine or home changes behaviour.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
