name: Nix CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Check flake
        run: scripts/ci/check-flake.sh

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Check probes
        env:
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_SHARDS: 8
        run: scripts/ci/check-probes.sh

  probes:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All probe shards passed
        env:
          RESULT: ${{ needs.probe.result }}
        run: test "$RESULT" = success

  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Report behaviour changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          report="$(scripts/ci/report.sh "origin/${BASE_REF}")"
          {
            echo '## What this changes on each machine'
            echo
            if test -n "$report"; then
              echo "$report"
            else
              echo 'No machine or home changes behaviour.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
