name: Nix CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Test update selector
        if: runner.os == 'Linux'
        run: tests/ci/update-flake-inputs.sh

      - name: Check flake
        run: scripts/ci/check-flake.sh
