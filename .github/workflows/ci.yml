name: Nix CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev"]

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the running checks
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # lint, evaluate every machine and home, flake checks (incl. tests/)
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # read-only: locked flake inputs and builds come from our cache, not from
      # (sometimes flaky) upstream hosts
      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Check flake
        run: scripts/ci/check-flake.sh

  # every feature and profile imported into a real host, split across runners
  # (evaluation-bound: one runner took ~13 min)
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # read-only: locked flake inputs and builds come from our cache, not from
      # (sometimes flaky) upstream hosts
      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Check probes
        env:
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_SHARDS: 4
        run: scripts/ci/check-probes.sh

  # the required check: passes only if every probe shard did
  probes:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All probe shards passed
        env:
          RESULT: ${{ needs.probe.result }}
        run: test "$RESULT" = success

  # what the pull request changes on each machine and home
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # read-only: locked flake inputs and builds come from our cache, not from
      # (sometimes flaky) upstream hosts
      - uses: cachix/cachix-action@v17
        with:
          name: anntnzrb
          skipPush: true

      - name: Report behaviour changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          report="$(scripts/ci/report.sh "origin/${BASE_REF}")"
          {
            echo '## What this changes on each machine'
            echo
            if test -n "$report"; then
              echo "$report"
            else
              echo 'No machine or home changes behaviour.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
