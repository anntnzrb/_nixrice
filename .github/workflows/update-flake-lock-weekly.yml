name: Nix Flake Lock Input Update

on:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    uses: ./.github/workflows/update-flake-lock.yml
    with:
      # clan-core carries the stable nixpkgs (nixpkgs follows clan-core/nixpkgs);
      # flake-checker fails once it is older than 30 days
      update_inputs: nixpkgs-unstable clan-core
